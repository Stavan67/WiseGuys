                    submitBtn.disabled = false;
                });
        });

        window.__onMenuItemsLoaded = function (categories) {
            categoriesCache = categories.map(function (cat) {
                return { categoryId: cat.categoryId, categoryName: cat.categoryName };
            });

            var flat = [];
            categories.forEach(function (cat) {
                (cat.items || []).forEach(function (it) { flat.push(it); });
            });
            window.__menuItemsFlatCache = flat;
        };
    })();
</script>
<script>
    (function () {
        var viewDashboard = document.getElementById('view-dashboard');
        var viewMenuItems = document.getElementById('view-menu-items');
        var viewManageAddons = document.getElementById('view-manage-addons');
        var container = document.getElementById('manage-addons-container');
        var bottomStatusBar = document.getElementById('bottom-status-bar');

        var addonsLoaded = false;
        var allAddonsCache = [];       // [{id, name, price, active}]
        var boardCache = null;         // AdminAddonAssignmentBoardResponse
        var activeSection = 'addons';  // 'addons' | 'assign'
        var addonFormOverlay = document.getElementById('addon-form-overlay');
        var addonFormTitle = document.getElementById('addon-form-title');
        var addonFormError = document.getElementById('addon-form-error');
        var addonFormNameInput = document.getElementById('addon-form-name');
        var addonFormPriceInput = document.getElementById('addon-form-price');
        var addonFormSubmitBtn = document.getElementById('addon-form-submit-btn');
        var addonFormCloseBtn = document.getElementById('addon-form-close-btn');
        var editingAddonId = null;

        function openAddonForm(addon) {
            editingAddonId = addon ? addon.id : null;
            addonFormTitle.textContent = addon ? 'Edit Addon' : 'Add Addon';
            addonFormSubmitBtn.textContent = addon ? 'Save Changes' : 'Save Addon';
            addonFormNameInput.value = addon ? addon.name : '';
            addonFormPriceInput.value = addon ? addon.price : '';
            addonFormError.classList.remove('visible');
            addonFormError.textContent = '';
            addonFormOverlay.classList.add('visible');
        }

        function closeAddonForm() {
            addonFormOverlay.classList.remove('visible');
            editingAddonId = null;
        }

        addonFormCloseBtn.addEventListener('click', closeAddonForm);

        addonFormOverlay.addEventListener('click', function (e) {
            if (e.target === addonFormOverlay) closeAddonForm();
        });

        addonFormSubmitBtn.addEventListener('click', function () {
            var name = addonFormNameInput.value.trim();
            var price = parseFloat(addonFormPriceInput.value);

            addonFormError.classList.remove('visible');

            if (!name) {
                addonFormError.textContent = 'Name is required.';
                addonFormError.classList.add('visible');
                return;
            }
            if (isNaN(price) || price < 0) {
                addonFormError.textContent = 'A valid, non-negative price is required.';
                addonFormError.classList.add('visible');
                return;
            }

            var url = editingAddonId ? ('/api/admin/addons/' + editingAddonId) : '/api/admin/addons';
            var method = editingAddonId ? 'PUT' : 'POST';

            addonFormSubmitBtn.disabled = true;

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, price: price })
            })
                .then(function (res) {
                    if (!res.ok) return res.text().then(function (msg) { throw new Error(msg || 'Could not save addon.'); });
                    return res.json();
                })
                .then(function (saved) {
                    var wasEdit = !!editingAddonId;
                    if (wasEdit) {
                        var idx = allAddonsCache.findIndex(function (a) { return a.id === saved.id; });
                        if (idx !== -1) allAddonsCache[idx] = saved;
                    } else {
                        allAddonsCache.push(saved);
                    }
                    closeAddonForm();
                    render();
                    window.showToast(wasEdit ? 'Addon updated' : 'Addon created');
                })
                .catch(function (err) {
                    addonFormError.textContent = err.message || 'Could not save addon.';
                    addonFormError.classList.add('visible');
                })
                .finally(function () {
                    addonFormSubmitBtn.disabled = false;
                });
        });

        window.__showManageAddonsView = function () {
            viewDashboard.classList.remove('active');
            viewMenuItems.classList.remove('active');
            viewManageAddons.classList.add('active');
            if (bottomStatusBar) bottomStatusBar.style.display = 'none';

            if (!addonsLoaded) {
                loadBoard();
            } else {
                render();
            }
        };

        window.__hideManageAddonsView = function () {
            viewManageAddons.classList.remove('active');
        };

        function escapeHtmlLocal(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatMoneyLocal(amount) {
            var num = Number(amount) || 0;
            return '\u20B9' + num.toFixed(2).replace(/\.00$/, '');
        }

        function loadBoard() {
            container.innerHTML = '<div class="empty-state">Loading addons...</div>';
            fetch('/api/admin/addons/assignment-board')
                .then(function (res) {
                    if (!res.ok) throw new Error('Could not load addons.');
                    return res.json();
                })
                .then(function (data) {
                    addonsLoaded = true;
                    boardCache = data;
                    allAddonsCache = data.allAddons;
                    render();
                })
                .catch(function () {
                    container.innerHTML = '<div class="empty-state">Could not load addons. Try again.</div>';
                });
        }

        function render() {
            var html = '<div class="section-tabs">' +
                '<button type="button" class="section-tab-btn' + (activeSection === 'addons' ? ' active' : '') + '" data-section="addons">Addons</button>' +
                '<button type="button" class="section-tab-btn' + (activeSection === 'assign' ? ' active' : '') + '" data-section="assign">Assign to Items</button>' +
                '</div>';

            html += activeSection === 'addons' ? renderAddonsSection() : renderAssignSection();
            container.innerHTML = html;
            attachHandlers();
        }

        function renderAddonsSection() {
            var html = '<div class="menu-admin-toolbar">' +
                '<button type="button" class="add-item-btn" id="add-addon-btn">+ Add Addon</button>' +
                '</div>';

            if (allAddonsCache.length === 0) {
                html += '<div class="empty-state">No addons yet. Tap "+ Add Addon" to create one.</div>';
                return html;
            }

            allAddonsCache.forEach(function (addon) {
                html += '<div class="addon-row" data-addon-id="' + addon.id + '">' +
                    '<div class="addon-row-info">' +
                    '<div class="addon-row-name">' + escapeHtmlLocal(addon.name) + '</div>' +
                    '<div class="addon-row-price">' + formatMoneyLocal(addon.price) + '</div>' +
                    '</div>' +
                    '<button type="button" class="item-edit-btn addon-edit-btn" data-addon-id="' + addon.id + '" aria-label="Edit addon">' +
                    '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' +
                    '</button>' +
                    '<label class="switch">' +
                    '<input type="checkbox" class="addon-active-checkbox" ' + (addon.active ? 'checked' : '') + ' />' +
                    '<span class="switch-slider"></span>' +
                    '</label>' +
                    '</div>';
            });

            return html;
        }

        function renderAssignSection() {
            if (!boardCache || !boardCache.categories || boardCache.categories.length === 0) {
                return '<div class="empty-state">No menu items found.</div>';
            }

            var html = '';
            boardCache.categories.forEach(function (category) {
                if (!category.items || category.items.length === 0) return;
                html += '<div class="menu-admin-category">';
                html += '<h2>' + escapeHtmlLocal(category.categoryName) + '</h2>';

                category.items.forEach(function (item) {
                    html += '<div class="assign-item-row" data-item-id="' + item.menuItemId + '">';
                    html += '<div class="assign-item-name">' + escapeHtmlLocal(item.menuItemName) + '</div>';
                    html += '<div class="assign-addon-chips">';

                    allAddonsCache.filter(function (a) { return a.active; }).forEach(function (addon) {
                        var isAssigned = item.assignedAddonIds.indexOf(addon.id) !== -1;
                        html += '<label class="addon-chip' + (isAssigned ? ' selected' : '') + '" data-addon-id="' + addon.id + '">' +
                            '<input type="checkbox" ' + (isAssigned ? 'checked' : '') + ' />' +
                            escapeHtmlLocal(addon.name) +
                            '</label>';
                    });

                    html += '</div></div>';
                });

                html += '</div>';
            });

            return html || '<div class="empty-state">No menu items found.</div>';
        }

        function attachHandlers() {
            var sectionTabs = container.querySelectorAll('.section-tab-btn');
            sectionTabs.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    activeSection = btn.getAttribute('data-section');
                    render();
                });
            });

            if (activeSection === 'addons') {
                var addBtn = document.getElementById('add-addon-btn');
                if (addBtn) {
                    addBtn.addEventListener('click', function () { openAddonForm(null); });
                }

                container.querySelectorAll('.addon-edit-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var addonId = btn.getAttribute('data-addon-id');
                        var addon = allAddonsCache.find(function (a) { return String(a.id) === addonId; });
                        if (addon) openAddonForm(addon);
                    });
                });

                container.querySelectorAll('.addon-active-checkbox').forEach(function (checkbox) {
                    checkbox.addEventListener('change', function () {
                        var row = checkbox.closest('.addon-row');
                        var addonId = row.getAttribute('data-addon-id');
                        var newActive = checkbox.checked;
                        checkbox.disabled = true;

                        fetch('/api/admin/addons/' + addonId + '/active?active=' + newActive, {
                            method: 'PATCH'
                        })
                            .then(function (res) {
                                if (!res.ok) throw new Error('Could not update addon.');
                                return res.json();
                            })
                            .then(function (updated) {
                                var cached = allAddonsCache.find(function (a) { return a.id === updated.id; });
                                if (cached) cached.active = updated.active;
                                window.showToast(updated.active ? 'Addon activated' : 'Addon deactivated');
                            })
                            .catch(function () {
                                checkbox.checked = !newActive;
                            })
                            .finally(function () {
                                checkbox.disabled = false;
                            });
                    });
                });
            } else {
                container.querySelectorAll('.addon-chip').forEach(function (chip) {
                    chip.addEventListener('click', function (e) {
                        e.preventDefault();
                        var row = chip.closest('.assign-item-row');
                        var itemId = row.getAttribute('data-item-id');
                        var addonId = Number(chip.getAttribute('data-addon-id'));
                        var willSelect = !chip.classList.contains('selected');

                        var itemEntry = null;
                        boardCache.categories.some(function (cat) {
                            return cat.items.some(function (it) {
                                if (String(it.menuItemId) === itemId) {
                                    itemEntry = it;
                                    return true;
                                }
                                return false;
                            });
                        });
                        if (!itemEntry) return;

                        var nextIds = willSelect
                            ? itemEntry.assignedAddonIds.concat([addonId])
                            : itemEntry.assignedAddonIds.filter(function (id) { return id !== addonId; });

                        chip.classList.toggle('selected', willSelect);
                        chip.querySelector('input').checked = willSelect;

                        fetch('/api/admin/addons/items/' + itemId, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ addonIds: nextIds })
                        })
                            .then(function (res) {
                                if (!res.ok) throw new Error('Could not update assignment.');
                                itemEntry.assignedAddonIds = nextIds;
                                window.showToast('Addon assignment updated');
                            })
                            .catch(function () {
                                chip.classList.toggle('selected', !willSelect);
                                chip.querySelector('input').checked = !willSelect;
                            });
                    });
                });
            }
        }
    })();
</script>
<script>
    (function () {
        var viewDashboard = document.getElementById('view-dashboard');
        var viewMenuItems = document.getElementById('view-menu-items');
        var viewManageCategories = document.getElementById('view-manage-categories');
        var container = document.getElementById('manage-categories-container');
        var bottomStatusBar = document.getElementById('bottom-status-bar');

        var categoriesLoaded = false;
        var categoriesCache = []; // [{id, name, displayOrder, active}]

        window.__showManageCategoriesView = function () {
            viewDashboard.classList.remove('active');
            viewMenuItems.classList.remove('active');
            viewManageCategories.classList.add('active');
            if (bottomStatusBar) bottomStatusBar.style.display = 'none';

            loadCategories();
        };

        window.__hideManageCategoriesView = function () {
            viewManageCategories.classList.remove('active');
        };

        function escapeHtmlLocal(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function loadCategories() {
            container.innerHTML = '<div class="empty-state">Loading categories...</div>';
            fetch('/api/admin/categories')
                .then(function (res) {
                    if (!res.ok) throw new Error('Could not load categories.');
                    return res.json();
                })
                .then(function (data) {
                    categoriesLoaded = true;
                    categoriesCache = data;
                    render();
                })
                .catch(function () {
                    container.innerHTML = '<div class="empty-state">Could not load categories. Try again.</div>';
                });
        }

        function render() {
            var html = '<div class="menu-admin-toolbar">' +
                '<button type="button" class="add-item-btn" id="add-category-btn">+ Add Category</button>' +
                '</div>';

            if (categoriesCache.length === 0) {
                html += '<div class="empty-state">No categories yet. Tap "+ Add Category" to create one.</div>';
                container.innerHTML = html;
                attachHandlers();
                return;
            }

            categoriesCache.forEach(function (category) {
                html += '<div class="addon-row" data-category-id="' + category.id + '">' +
                    '<div class="addon-row-info">' +
                    '<div class="addon-row-name">' + escapeHtmlLocal(category.name) + '</div>' +
                    '<div class="addon-row-price">Order: ' + category.displayOrder + '</div>' +
                    '</div>' +
                    '<button type="button" class="item-edit-btn category-edit-btn" data-category-id="' + category.id + '" aria-label="Edit category">' +
                    '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' +
                    '</button>' +
                    '<label class="switch">' +
                    '<input type="checkbox" class="category-active-checkbox" ' + (category.active ? 'checked' : '') + ' />' +
                    '<span class="switch-slider"></span>' +
                    '</label>' +
                    '</div>';
            });

            container.innerHTML = html;
            attachHandlers();
        }

        function attachHandlers() {
            var addBtn = document.getElementById('add-category-btn');
            if (addBtn) {
                addBtn.addEventListener('click', function () { openCategoryForm(null); });
            }

            container.querySelectorAll('.category-edit-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var categoryId = btn.getAttribute('data-category-id');
                    var category = categoriesCache.find(function (c) { return String(c.id) === categoryId; });
                    if (category) openCategoryForm(category);
                });
            });

            container.querySelectorAll('.category-active-checkbox').forEach(function (checkbox) {
                checkbox.addEventListener('change', function () {
                    var row = checkbox.closest('.addon-row');
                    var categoryId = row.getAttribute('data-category-id');
                    var newActive = checkbox.checked;
                    checkbox.disabled = true;

                    fetch('/api/admin/categories/' + categoryId + '/active?active=' + newActive, {
                        method: 'PATCH'
                    })
                        .then(function (res) {
                            if (!res.ok) throw new Error('Could not update category.');
                            return res.json();
                        })
                        .then(function (updated) {
                            var cached = categoriesCache.find(function (c) { return c.id === updated.id; });
                            if (cached) cached.active = updated.active;
                            window.showToast(updated.active ? 'Category activated' : 'Category deactivated');
                        })
                        .catch(function () {
                            checkbox.checked = !newActive;
                        })
                        .finally(function () {
                            checkbox.disabled = false;
                        });
                });
            });
        }

        // --- Add / Edit category modal ---
        var categoryFormOverlay = document.getElementById('category-form-overlay');
        var categoryFormTitle = document.getElementById('category-form-title');
        var categoryFormError = document.getElementById('category-form-error');
        var categoryFormNameInput = document.getElementById('category-form-name');
        var categoryFormOrderInput = document.getElementById('category-form-order');
        var categoryFormSubmitBtn = document.getElementById('category-form-submit-btn');
        var categoryFormCloseBtn = document.getElementById('category-form-close-btn');
        var editingCategoryId = null;

        function openCategoryForm(category) {
            editingCategoryId = category ? category.id : null;
            categoryFormTitle.textContent = category ? 'Edit Category' : 'Add Category';
            categoryFormSubmitBtn.textContent = category ? 'Save Changes' : 'Save Category';
            categoryFormNameInput.value = category ? category.name : '';
            categoryFormOrderInput.value = category ? category.displayOrder : '';
            categoryFormError.classList.remove('visible');
            categoryFormError.textContent = '';
            categoryFormOverlay.classList.add('visible');
        }

        function closeCategoryForm() {
            categoryFormOverlay.classList.remove('visible');
            editingCategoryId = null;
        }

        categoryFormCloseBtn.addEventListener('click', closeCategoryForm);

        categoryFormOverlay.addEventListener('click', function (e) {
            if (e.target === categoryFormOverlay) closeCategoryForm();
        });

        categoryFormSubmitBtn.addEventListener('click', function () {
            var name = categoryFormNameInput.value.trim();
            var orderRaw = categoryFormOrderInput.value.trim();

            categoryFormError.classList.remove('visible');

            if (!name) {
                categoryFormError.textContent = 'Name is required.';
                categoryFormError.classList.add('visible');
                return;
            }

            var displayOrder = null;
            if (orderRaw !== '') {
                displayOrder = parseInt(orderRaw, 10);
                if (isNaN(displayOrder) || displayOrder < 0) {
                    categoryFormError.textContent = 'Display order must be zero or a positive number.';
                    categoryFormError.classList.add('visible');
                    return;
                }
            }

            var payload = { name: name, displayOrder: displayOrder };

            var url = editingCategoryId ? ('/api/admin/categories/' + editingCategoryId) : '/api/admin/categories';
            var method = editingCategoryId ? 'PUT' : 'POST';

            categoryFormSubmitBtn.disabled = true;

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(function (res) {
                    if (!res.ok) return res.text().then(function (msg) { throw new Error(msg || 'Could not save category.'); });
                    return res.json();
                })
                .then(function (saved) {
                    var wasEdit = !!editingCategoryId;
                    if (wasEdit) {
                        var idx = categoriesCache.findIndex(function (c) { return c.id === saved.id; });
                        if (idx !== -1) categoriesCache[idx] = saved;
                    } else {
                        categoriesCache.push(saved);
                    }
                    categoriesCache.sort(function (a, b) { return a.displayOrder - b.displayOrder; });
                    closeCategoryForm();
                    render();
                    window.showToast(wasEdit ? 'Category updated' : 'Category created');
                })
                .catch(function (err) {
                    categoryFormError.textContent = err.message || 'Could not save category.';
                    categoryFormError.classList.add('visible');
                })
                .finally(function () {
                    categoryFormSubmitBtn.disabled = false;
                });
        });
    })();
</script>
</script>
<script>
    (function () {
        var viewDashboard = document.getElementById('view-dashboard');
        var viewMenuItems = document.getElementById('view-menu-items');
        var viewManageTables = document.getElementById('view-manage-tables');
        var container = document.getElementById('manage-tables-container');
        var bottomStatusBar = document.getElementById('bottom-status-bar');

        var tablesLoaded = false;
        var tablesCache = []; // [{id, tableNumber, active, menuUrl}]

        window.__showManageTablesView = function () {
            viewDashboard.classList.remove('active');
            viewMenuItems.classList.remove('active');
            viewManageTables.classList.add('active');
            if (bottomStatusBar) bottomStatusBar.style.display = 'none';
            loadTables();
        };

        window.__hideManageTablesView = function () {
            viewManageTables.classList.remove('active');
        };

        function escapeHtmlLocal(str) {
            var div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function loadTables() {
            container.innerHTML = '<div class="empty-state">Loading tables...</div>';
            fetch('/api/admin/tables')
                .then(function (res) {
                    if (!res.ok) throw new Error('Could not load tables.');
                    return res.json();
                })
                .then(function (data) {
                    tablesLoaded = true;
                    tablesCache = data;
                    render();
                })
                .catch(function () {
                    container.innerHTML = '<div class="empty-state">Could not load tables. Try again.</div>';
                });
        }

        function render() {
            var html = '<div class="menu-admin-toolbar">' +
                '<button type="button" class="add-item-btn" id="add-table-btn">+ Add Table</button>' +
                '<a class="add-item-btn" id="download-all-qr-link" href="/api/admin/tables/qr/all" style="text-decoration:none;display:inline-block;margin-left:8px;">Download All QR Codes</a>' +
                '</div>';

            if (tablesCache.length === 0) {
                html += '<div class="empty-state">No tables yet. Tap "+ Add Table" to create one.</div>';
                container.innerHTML = html;
                attachHandlers();
                return;
            }

            tablesCache.forEach(function (table) {
                var qrSrc = '/api/admin/tables/' + encodeURIComponent(table.tableNumber) + '/qr';

                html += '<div class="addon-row" data-table-number="' + escapeHtmlLocal(table.tableNumber) + '" style="align-items:center;">' +
                    '<img src="' + qrSrc + '" alt="QR for table ' + escapeHtmlLocal(table.tableNumber) + '" ' +
                    'style="height:88px;width:auto;object-fit:contain;flex-shrink:0;border-radius:8px;border:1px solid rgba(0,0,0,0.12);margin-right:14px;background:#fff;padding:4px;box-shadow:0 1px 4px rgba(59,20,16,0.12);" />' +
                    '<div class="addon-row-info">' +
                    '<div class="addon-row-name">Table ' + escapeHtmlLocal(table.tableNumber) + '</div>' +
                    '<div class="addon-row-price">' + (table.active ? 'Active' : 'Inactive') + '</div>' +
                    '</div>' +
                    '<a class="item-edit-btn table-download-btn" href="' + qrSrc + '" download="table-' + escapeHtmlLocal(table.tableNumber) + '-qr.png" aria-label="Download QR code" title="Download QR code">' +
                    '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>' +
                    '</a>' +
                    '</div>';
            });

            container.innerHTML = html;
            attachHandlers();
        }

        function attachHandlers() {
            var addBtn = document.getElementById('add-table-btn');
            if (addBtn) addBtn.addEventListener('click', openTableForm);
        }

        var tableFormOverlay = document.getElementById('table-form-overlay');
        var tableFormError = document.getElementById('table-form-error');
        var tableFormNumberInput = document.getElementById('table-form-number');
        var tableFormSubmitBtn = document.getElementById('table-form-submit-btn');
        var tableFormCloseBtn = document.getElementById('table-form-close-btn');

        function openTableForm() {
            tableFormNumberInput.value = '';
            tableFormError.classList.remove('visible');
            tableFormError.textContent = '';
            tableFormOverlay.classList.add('visible');
        }

        function closeTableForm() {
            tableFormOverlay.classList.remove('visible');
        }

        tableFormCloseBtn.addEventListener('click', closeTableForm);

        tableFormOverlay.addEventListener('click', function (e) {
            if (e.target === tableFormOverlay) closeTableForm();
        });

        tableFormSubmitBtn.addEventListener('click', function () {
            var tableNumber = tableFormNumberInput.value.trim();
            tableFormError.classList.remove('visible');

            if (!tableNumber) {
                tableFormError.textContent = 'Table number is required.';
                tableFormError.classList.add('visible');
                return;
            }

            var alreadyExists = tablesCache.some(function (t) {
                return t.tableNumber.toLowerCase() === tableNumber.toLowerCase();
            });
            if (alreadyExists) {
                tableFormError.textContent = 'A table with this number already exists.';
                tableFormError.classList.add('visible');
                return;
            }

            tableFormSubmitBtn.disabled = true;

            fetch('/api/admin/tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableNumber: tableNumber })
            })
                .then(function (res) {
                    if (!res.ok) return res.text().then(function (msg) { throw new Error(msg || 'Could not save table.'); });
                    return res.json();
                })
                .then(function (saved) {
                    tablesCache.push(saved);
                    closeTableForm();
                    render();
                    window.showToast('Table created — QR code is ready below');
                })
                .catch(function (err) {
                    tableFormError.textContent = err.message || 'Could not save table.';
                    tableFormError.classList.add('visible');
                })
                .finally(function () {
                    tableFormSubmitBtn.disabled = false;
                });
        });
    })();
</script>
