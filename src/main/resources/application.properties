spring.application.name=WiseGuys

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:wiseguys_cafe}
spring.datasource.username=${PGUSER:wiseguys_admin}
spring.datasource.password=${PGPASSWORD:wiseguys_pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn

server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.base-url=${APP_BASE_URL:http://localhost:8080}

app.admin.username=${ADMIN_USERNAME:WiseGuysAdmin}
app.admin.password=${ADMIN_PASSWORD:local-dev-only}